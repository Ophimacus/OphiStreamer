name: Android tester APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OphiStreamer-Tester.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OphiStreamer-Tester
          path: android/OphiStreamer-Tester.apk

      # Fixed download link for the phone:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/OphiStreamer-Tester.apk
      - name: Publish to "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest OphiStreamer-Tester.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android tester (latest build)" \
            --notes "Built from $GITHUB_SHA. Install on the phone; uninstall the old version first if Android refuses to update."
